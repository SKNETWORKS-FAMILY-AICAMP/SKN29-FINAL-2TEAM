name: skn29-final-2team

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: project_copilot
      POSTGRES_USER: project_copilot
      POSTGRES_PASSWORD: project_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../DB/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_copilot -d project_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ../../.env
    environment:
      # Drive에서 내려받은 원문을 두는 곳. `/app`은 소스 바인드 마운트라 여기에
      # 쓰면 문서가 git 작업 트리에 섞인다. 별도 볼륨을 쓴다.
      DOCUMENT_STORAGE_ROOT: /var/lib/halil/documents
    ports:
      - "8000:8000"
    volumes:
      - ../../:/app
      - document_storage:/var/lib/halil/documents

  # 스킬 등록 검증 워커 — 정본: "스킬 검증·등록 최종 설계.md" §10.
  #
  # `web`과 같은 이미지·환경변수·DB를 쓰되 HTTP 포트는 안 연다 — 요청을 받는
  # 프로세스가 아니라 `skill_registration_job`을 폴링하는 상시 프로세스다.
  # 2026-08-26 이전에는 사람이 `docker exec ... skill_validation_worker`로
  # 수동 실행했다 — 그 사이엔 job이 QUEUED에 머물러서 진행 카드(SkillJobCenter)가
  # 계속 "검증 대기 중"으로 안 넘어갔다(실제로 겪음). 이 서비스가 그 문제를 없앤다.
  skill-validation-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py skill_validation_worker"
    env_file:
      - ../../.env
    volumes:
      - ../../:/app
    depends_on:
      db:
        condition: service_healthy
    # claim_next()가 SKIP LOCKED로 서로 다른 job을 가져가므로 두 등록을 병렬 검증한다.
    deploy:
      replicas: 2

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
  document_storage:
