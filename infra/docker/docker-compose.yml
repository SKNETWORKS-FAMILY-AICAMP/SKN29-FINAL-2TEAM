name: skn29-final-2team

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: project_copilot
      POSTGRES_USER: project_copilot
      POSTGRES_PASSWORD: project_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../DB/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_copilot -d project_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://project_copilot:project_copilot@db:5432/project_copilot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../:/app

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
