# 시연용 MCP 서버(+ 로컬에서만 쓰는 공개 https 터널).
#
# 기본 `docker-compose.yml` 에 넣지 않는다 — 팀원 전원의 `up` 에 딸려 올라갈
# 이유가 없다. 시연·시험 때만 파일을 하나 더 얹는다.
#
# ─────────────────────────────────────────────────────────────────────────
# ⚠ **왜 https 주소가 필요한가**
#
# `services/mcp/security.py` 가 **https 가 아닌 주소와 사설 IP·내부 이름을
# 거절한다.** 의도된 설계다 — 「로컬 개발용 http 서버는 설정으로 여는 순간
# 운영에서도 열린다」. 그래서 컨테이너 주소(`http://dev-mcp:9000`)로는
# 화면에서 등록할 수 없고, 공인 https 주소가 있어야 한다.
#
# **그 https 를 어디서 얻느냐가 AWS 와 로컬에서 다르다.**
# ─────────────────────────────────────────────────────────────────────────
#
# ## AWS (2026-08-14~) — 터널을 띄우지 않는다
#
#   docker compose -f infra/docker/docker-compose.aws.yml \
#                  -f infra/docker/docker-compose.dev-mcp.yml up -d dev-mcp
#
# Caddy 가 `mcp.halil-ai.site` 를 받아 `dev-mcp:9000` 으로 넘긴다. 주소가
# **고정**이므로 시연 직전에 MCP 서버를 다시 등록하는 절차가 없어졌다.
# `mcp-tunnel` 은 여기서 필요 없다 — 서비스명을 빼고 `dev-mcp` 만 올린다.
#
# ## 로컬 — 터널이 여전히 필요하다
#
#   docker compose -f infra/docker/docker-compose.yml \
#                  -f infra/docker/docker-compose.dev-mcp.yml up -d dev-mcp mcp-tunnel
#
# 노트북에는 공인 https 주소가 없다. 주소는 터널 로그에서 읽는다:
#
#   docker logs skn29-mcp-tunnel 2>&1 | grep -o "https://[a-z0-9-]*\.trycloudflare\.com"
#
# ⚠ **주소가 재시작마다 바뀐다.** 터널을 내렸다 올리면 **등록해 둔 MCP 서버는
# 죽은 주소를 가리킨다** — 화면에서 「수정」으로 새 주소를 넣어야 한다.
# ─────────────────────────────────────────────────────────────────────────

services:
  dev-mcp:
    image: python:3.13-slim
    container_name: skn29-dev-mcp
    working_dir: /srv
    volumes:
      - ../dev-mcp:/srv:ro
    environment:
      MCP_DEV_PORT: "9000"
      # 인증 경로까지 시연하려면 값을 채운다. 비우면 토큰 검사를 하지 않는다.
      MCP_DEV_TOKEN: "dev-secret"
    command: ["python", "server.py"]
    # 시연 도중 재부팅돼도 살아 있어야 한다.
    restart: unless-stopped
    # 호스트 포트는 열지 않는다 — 터널이 같은 네트워크에서 직접 부른다.
    expose:
      - "9000"

  mcp-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: skn29-mcp-tunnel
    depends_on:
      - dev-mcp
    command: ["tunnel", "--no-autoupdate", "--url", "http://dev-mcp:9000"]
    restart: unless-stopped
