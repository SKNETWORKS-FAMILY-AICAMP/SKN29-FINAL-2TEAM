name: skn29-final-2team

# AWS EC2 시연 환경용 Compose 파일입니다.
# PostgreSQL은 컨테이너가 아니라 RDS를 사용하므로 db 서비스가 없습니다.
services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
