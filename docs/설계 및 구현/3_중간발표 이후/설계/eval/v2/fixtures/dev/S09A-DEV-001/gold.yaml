retry_contract:
  logical_call_count: 1
  physical_attempt_count: 2
  expected_sequence:
    - attempt: 1
      outcome: RETRYABLE_TIMEOUT
    - attempt: 2
      outcome: SUCCESS
  forbidden_sequences:
    - no_retry_after_retryable_timeout
    - more_than_2_physical_attempts
    - retry_with_different_semantic_query
    - duplicate_logical_tool_call_for_runtime_retry

required_criteria:
  - controlled_retry_sequence
  - retry_budget_respected
  - required_fact_coverage
  - factual_grounding
  - unsupported_claim_control

oracle_bindings:
  - criterion: controlled_retry_sequence
    authoritative_oracle: DETERMINISTIC
    scorer_identity: physical-attempt-sequence-checker-v1
  - criterion: retry_budget_respected
    authoritative_oracle: DETERMINISTIC
    scorer_identity: retry-budget-checker-v1
  - criterion: required_fact_coverage
