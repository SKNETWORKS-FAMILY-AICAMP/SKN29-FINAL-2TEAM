preconditions:
  - 네 PDF가 평가 계정의 격리된 문서 공간에 원본 그대로 업로드돼 있다.
  - 네 PDF가 모두 검색 준비 상태다.
  - repo_path, sha256와 실제 업로드 doc_id의 결속표가 fixture instance에 기록된다.
  - 같은 사업의 더 최신 문서는 평가 검색 범위에 존재하지 않는다.
  - required observable 수집기가 준비돼 있다.

fixture_instance_policy: STATIC_EXISTING_PDF
allowed_tools: [document_search, document_list]
forbidden_tools: [task_register, task_update, jira_create_issues, skill_register, web_search]
side_effect_policy: READ_ONLY

required_observables:
  - final_answer
  - logical_tool_calls
  - retrieved_document_identity
  - retrieved_document_timestamp
  - answer_evidence_links

preflight_contract:
  checksum_match_required: true
  search_probe_required: true
  expected_source_ids: [PDF-SOW, PDF-REQ, PDF-WBS, PDF-MIN]
  all_required_sources_retrievable: true

cleanup_contract:
  exact_uploaded_doc_ids_required: true
  delete_only_fixture_copies: true
  preserve_repository_pdf: true
  verify_document_rows_zero: true
  verify_index_rows_zero: true

readiness:
  contract_requirement: DEFINED
  fixture_status: VALIDATED
  instrumentation_status: READY_FOR_DEV
  official_execution_status: DEV_PILOT_COMPLETE
  implementation_evidence:
    - scripts/eval_v2_documents.py가 실제 PDF를 평가 계정에 결속하고 검색 probe를 수행한다.
    - fixture instance binding에 source_id와 실제 doc_id를 저장한다.
    - scripts/eval_v2_s01.py로 VALID DEV 3회를 실행하고 append-only 결과를 저장했다.

provenance:
