<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wonbin 도클링 파싱 파이프라인</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0d1a2c;--line:#26364b;--text:#edf4ff;--muted:#94a5ba;--accent:#368cff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:radial-gradient(circle at 50% 0,#132b4a 0,#07111f 52%);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;color:var(--text)}button{font:inherit;color:inherit}.app{height:100dvh;display:grid;grid-template-rows:52px minmax(0,1fr) 58px}.bar{display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(9,21,38,.94);backdrop-filter:blur(16px);z-index:10}.top{border-bottom:1px solid var(--line)}.bottom{justify-content:center;border-top:1px solid var(--line)}.title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:650}.btn{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#122238;cursor:pointer}.btn:hover{background:#1b3150}.btn:focus-visible{outline:2px solid var(--accent)}.stage{position:relative;min-height:0;overflow:hidden}.viewport{position:absolute;inset:14px;overflow:hidden}.canvas{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;background:#fff;box-shadow:0 22px 80px rgba(0,0,0,.5)}.el{position:absolute;overflow:hidden}.shape{border-style:solid}.shape.roundRect{border-radius:10px}.shape.ellipse{border-radius:50%}.shape.diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.line{overflow:visible;background:transparent}.text{display:flex}.text-inner{width:100%;min-width:0;white-space:pre-wrap;word-break:keep-all}.text-inner p{margin:0}.image,.video{display:block}.video{background:#071426}.counter{min-width:76px;text-align:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.counter strong{color:var(--text)}.drawer{position:fixed;z-index:20;inset:52px 0 58px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));align-content:start;gap:14px;padding:20px;overflow:auto;background:rgba(5,13,25,.98);visibility:hidden;opacity:0;transition:.15s}.drawer.open{visibility:visible;opacity:1}.thumb{padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;background:#fff;cursor:pointer}.thumb.active{border-color:var(--accent)}.mini{position:relative;width:1280px;height:720px;transform-origin:0 0}.mini-wrap{aspect-ratio:16/9;overflow:hidden;background:#fff}.thumb span{display:block;padding:7px 9px;background:#122036;color:var(--muted);font-size:12px;text-align:left}.progress{position:fixed;left:0;bottom:57px;height:2px;background:var(--accent);z-index:11;transition:width .2s}@media(max-width:680px){.viewport{inset:6px}.drawer{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}}:fullscreen .app{grid-template-rows:0 minmax(0,1fr) 0}:fullscreen .bar{visibility:hidden}:fullscreen .viewport{inset:0}:fullscreen .progress{bottom:0}
  </style>
</head>
<body>
  <main class="app"><header class="bar top"><div class="title">wonbin 도클링 파싱 파이프라인</div><button class="btn" id="grid" title="전체 슬라이드">▦</button><button class="btn" id="full" title="전체 화면">⛶</button></header><section class="stage"><div class="viewport" id="viewport"><div class="canvas" id="canvas" role="img"></div></div></section><div class="progress" id="progress"></div><nav class="bar bottom"><button class="btn" id="first" title="처음">⇤</button><button class="btn" id="prev" title="이전">←</button><div class="counter"><strong id="now">1</strong> / <span id="total">53</span></div><button class="btn" id="next" title="다음">→</button><button class="btn" id="last" title="마지막">⇥</button></nav></main><aside class="drawer" id="drawer"></aside>
  <script src="deck-data.js"></script>
  <script>
    (()=>{const deck=window.WONBIN_DECK,canvas=document.getElementById('canvas'),viewport=document.getElementById('viewport'),drawer=document.getElementById('drawer');let current=Math.min(deck.slides.length,Math.max(1,+(location.hash.match(/slide=(\d+)/)||[])[1]||1));const px=n=>`${n||0}px`,color=v=>v&&v.startsWith('#')?v:(v==='tx1'?'#0a1020':v||'transparent');
    function textNode(e){const box=document.createElement('div');box.className='text-inner';const ps=e.paragraphs?.length?e.paragraphs:[{text:e.text||'',runs:[]}];ps.forEach(p=>{const line=document.createElement('p'),st=p.resolvedTextStyle||{};line.style.textAlign=st.alignment||e.textStyle?.alignment||'left';line.style.marginLeft=px(p.marginLeft);if(p.bulletCharacter)line.append(document.createTextNode(p.bulletCharacter+' '));if(p.runs?.length)p.runs.forEach(r=>{const s=document.createElement('span');s.textContent=r.text||'';s.style.fontSize=px(r.fontSize||st.fontSize||e.textStyle?.fontSize||16);s.style.fontFamily=r.typeface||st.typeface||e.textStyle?.typeface||'Pretendard';s.style.color=color(r.color||st.color||e.textStyle?.color);s.style.fontWeight=r.bold?'700':'400';s.style.fontStyle=r.italic?'italic':'normal';line.appendChild(s)});else line.append(document.createTextNode(p.text||''));box.appendChild(line)});return box}
    function balanced(e){if(e.name==='그림 194')return{...e,bbox:[1011.5,647,78.89,25]};if(e.name==='그림 195')return{...e,bbox:[1110.4,647,84.09,25]};return e}
    function make(source){const e=balanced(source),[x,y,w,h]=e.bbox,isImage=e.kind==='image',isVideo=e.kind==='video',el=isImage?document.createElement('img'):isVideo?document.createElement('video'):document.createElement('div');el.className=`el ${isImage?'image':isVideo?'video':'shape'} ${e.geometry||''}`;Object.assign(el.style,{left:px(x),top:px(y),width:px(w),height:px(h)});el.title=e.name||'';if(isImage){el.src=`media/${e.media}`;el.alt=e.name||'';el.style.objectFit=e.fit||'fill';if(e.filter)el.style.filter=e.filter;return el}if(isVideo){el.src=e.media;el.controls=e.controls!==false;el.preload='metadata';el.playsInline=true;return el}if(e.geometry==='line'||e.geometry==='straightConnector1'){el.className='el line';const lw=Math.max(e.lineWidth||1,1);if(w>=h){el.style.height=px(lw);el.style.background=color(e.lineColor)}else{el.style.width=px(lw);el.style.background=color(e.lineColor)}return el}el.style.background=e.fillColor?color(e.fillColor):'transparent';el.style.borderColor=e.lineColor?color(e.lineColor):'transparent';el.style.borderWidth=px(e.lineWidth||0);if(e.text!==undefined){el.classList.add('text');const ts=e.textStyle||{},ins=ts.insets||{};el.style.padding=`${px(ins.top)} ${px(ins.right)} ${px(ins.bottom)} ${px(ins.left)}`;el.style.alignItems=ts.verticalAlignment==='middle'?'center':ts.verticalAlignment==='bottom'?'flex-end':'flex-start';el.appendChild(textNode(e))}return el}
    function fit(){const r=viewport.getBoundingClientRect(),s=Math.min(r.width/1280,r.height/720)*.995;canvas.style.left=`${Math.max(0,(r.width-1280*s)/2)}px`;canvas.style.top=`${Math.max(0,(r.height-720*s)/2)}px`;canvas.style.transform=`scale(${s})`}
    function draw(n,hash=true){current=Math.min(deck.slides.length,Math.max(1,n));const slide=deck.slides[current-1];canvas.replaceChildren();canvas.style.background=slide.background;slide.elements.forEach(e=>canvas.appendChild(make(e)));canvas.setAttribute('aria-label',`슬라이드 ${current}`);document.getElementById('now').textContent=current;document.getElementById('progress').style.width=`${current/deck.slides.length*100}%`;document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',i===current-1));if(hash)history.replaceState(null,'',`#slide=${current}`);fit()}
    function mini(slide,index){const b=document.createElement('button');b.className='thumb';const wrap=document.createElement('div');wrap.className='mini-wrap';const c=document.createElement('div');c.className='mini';c.style.background=slide.background;slide.elements.forEach(e=>c.appendChild(make(e)));wrap.appendChild(c);const label=document.createElement('span');label.textContent=`슬라이드 ${index+1}`;b.append(wrap,label);b.onclick=()=>{draw(index+1);drawer.classList.remove('open')};return b}
    deck.slides.forEach((s,i)=>drawer.appendChild(mini(s,i)));const scaleThumbs=()=>drawer.querySelectorAll('.thumb').forEach(b=>{const w=b.querySelector('.mini-wrap');b.querySelector('.mini').style.transform=`scale(${w.clientWidth/1280})`});const toggleDrawer=()=>{drawer.classList.toggle('open');if(drawer.classList.contains('open'))scaleThumbs()};document.getElementById('total').textContent=deck.slides.length;document.getElementById('prev').onclick=()=>draw(current-1);document.getElementById('next').onclick=()=>draw(current+1);document.getElementById('first').onclick=()=>draw(1);document.getElementById('last').onclick=()=>draw(deck.slides.length);document.getElementById('grid').onclick=toggleDrawer;document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('resize',()=>{fit();if(drawer.classList.contains('open'))scaleThumbs()});addEventListener('keydown',e=>{if(e.key==='Escape')drawer.classList.remove('open');else if(e.key==='ArrowLeft'||e.key==='PageUp')draw(current-1);else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();draw(current+1)}else if(e.key==='Home')draw(1);else if(e.key==='End')draw(deck.slides.length);else if(e.key.toLowerCase()==='g')toggleDrawer();else if(e.key.toLowerCase()==='f')document.getElementById('full').click()});draw(current)})();
  </script>
</body></html>
