<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>halil 최종 발표 (통합본) — 인쇄본</title>
  <style>
    @page { size: 1280px 720px; margin: 0; }
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; padding: 0; background: #fff;
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; }
    .page { position: relative; width: 1280px; height: 720px; overflow: hidden;
      page-break-after: always; break-after: page; background: #fff; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .el { position: absolute; overflow: hidden; }
    .shape { border-style: solid; }
    .shape.roundRect { border-radius: 10px; }
    .shape.ellipse { border-radius: 50%; }
    .shape.diamond { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
    .shape.rightArrow { clip-path: polygon(0 28%, 62% 28%, 62% 0, 100% 50%, 62% 100%, 62% 72%, 0 72%); }
    .line { overflow: visible; background: transparent; }
    .text { display: flex; }
    .text-inner { width: 100%; min-width: 0; white-space: pre-wrap; word-break: keep-all; }
    .text-inner p { margin: 0; }
    .image, .video { display: block; }
    .video { background: #071426; }
  </style>
</head>
<body>
  <script src="deck-data.js"></script>
  <script src="wonbin-deck-data.js"></script>
  <script src="ops-4pages-data.js"></script>
  <script src="agent-v2-eval-data.js"></script>
  <script src="agent-v2-lifecycle-data.js"></script>
  <script src="juyeon-slides.js"></script>
  <script src="juneok-overview.js"></script>
  <script src="docling20.js"></script>
  <script src="slide31-embed.js"></script>
  <script src="slide21-embed.js"></script>
  <script src="content-updates.js"></script>
  <script>
    // index.html 의 렌더러(make/textNode)를 그대로 사용해 전 슬라이드를 세로로 쌓아 인쇄한다.
    (() => {
      const deck = window.HALIL_DECK;
      const px = n => `${n || 0}px`;
      const color = v => v && v.startsWith('#') ? v : (v === 'tx1' ? '#0a1020' : v || 'transparent');

      if (window.HALIL_DOCLING20) {
        const st = document.createElement('style');
        st.textContent = HALIL_DOCLING20.CSS;
        document.head.appendChild(st);
      }

      function textNode(e){const box=document.createElement('div');box.className='text-inner';const ps=e.paragraphs?.length?e.paragraphs:[{text:e.text||'',runs:[]}];ps.forEach(p=>{const line=document.createElement('p'),st=p.resolvedTextStyle||{};line.style.textAlign=st.alignment||e.textStyle?.alignment||'left';line.style.marginLeft=px(p.marginLeft);if(p.bulletCharacter)line.append(document.createTextNode(p.bulletCharacter+' '));if(p.runs?.length)p.runs.forEach(r=>{const s=document.createElement('span');s.textContent=r.text||'';s.style.fontSize=px(r.fontSize||st.fontSize||e.textStyle?.fontSize||16);s.style.fontFamily=r.typeface||st.typeface||e.textStyle?.typeface||'Pretendard';s.style.color=color(r.color||st.color||e.textStyle?.color);s.style.fontWeight=r.bold?'700':'400';s.style.fontStyle=r.italic?'italic':'normal';line.appendChild(s)});else line.append(document.createTextNode(p.text||''));box.appendChild(line)});return box}
      function make(source){const e=source,[x,y,w,h]=e.bbox;if(e.kind==='html'){const d=document.createElement('div');d.className='el';d.id=e.name||'';d.title=e.name||'';Object.assign(d.style,{left:px(x),top:px(y),width:px(w),height:px(h)});d.innerHTML=e.html;return d}const isImage=e.kind==='image',isVideo=e.kind==='video',el=isImage?document.createElement('img'):isVideo?document.createElement('video'):document.createElement('div');el.className=`el ${isImage?'image':isVideo?'video':'shape'} ${e.geometry||''}`;Object.assign(el.style,{left:px(x),top:px(y),width:px(w),height:px(h)});el.title=e.name||'';if(isImage){el.src=`media/${e.media}`;el.alt=e.name||'';el.style.objectFit=e.fit||'fill';if(e.filter)el.style.filter=e.filter;return el}if(isVideo){el.src=e.media;el.controls=e.controls!==false;el.preload='metadata';el.playsInline=true;return el}if(e.geometry==='line'||e.geometry==='straightConnector1'){el.className='el line';const lw=Math.max(e.lineWidth||1,1);if(w>=h){el.style.height=px(lw);el.style.background=color(e.lineColor)}else{el.style.width=px(lw);el.style.background=color(e.lineColor)}return el}el.style.background=e.fillColor?color(e.fillColor):'transparent';el.style.borderColor=e.lineColor?color(e.lineColor):'transparent';el.style.borderWidth=px(e.lineWidth||0);if(e.text!==undefined){el.classList.add('text');const ts=e.textStyle||{},ins=ts.insets||{};el.style.padding=`${px(ins.top)} ${px(ins.right)} ${px(ins.bottom)} ${px(ins.left)}`;el.style.alignItems=ts.verticalAlignment==='middle'?'center':ts.verticalAlignment==='bottom'?'flex-end':'flex-start';el.appendChild(textNode(e))}return el}

      // ?only=N — 검증용: N번 슬라이드 한 장만 렌더 (미지정 시 전체).
      const only = +(new URLSearchParams(location.search).get('only') || 0);
      deck.slides.forEach((slide, i) => {
        if (only && i + 1 !== only) return;
        const page = document.createElement('div');
        page.className = 'page';
        page._slide = slide;
        page.style.background = slide.background;
        slide.elements.forEach(e => page.appendChild(make(e)));
        // 인쇄본: 재생 불가한 영상은 포스터 프레임 + 컨트롤 숨김으로 정지 이미지 대체.
        page.querySelectorAll('video').forEach(v => {
          v.poster = 'media/demo-poster.jpg';
          v.removeAttribute('controls');
          v.preload = 'none';
        });
        document.body.appendChild(page);
      });

      // 인터랙티브 20p 는 인쇄본에선 인트로(기본) 상태로 고정. ?dl=N 으로 검증용 상태 지정.
      const dl = new URLSearchParams(location.search).has('dl')
        ? +new URLSearchParams(location.search).get('dl') : -1;
      document.querySelectorAll('.page').forEach((pg) => {
        const slide = pg._slide;
        if (slide && slide.doclingInteractive && window.HALIL_DOCLING20) {
          const root = pg.querySelector('#dl20');
          if (root) HALIL_DOCLING20.init(root, dl, () => {});
        }
      });

      document.title = `halil 최종 발표 (통합본) — ${deck.slides.length}p`;
    })();
  </script>
</body>
</html>
