<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 612" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <title>Deep Agent 실행 구조 + 요청 보안 가드레일</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <style>
    .bx      { fill:#EBE4D5; stroke:#C6B896; stroke-width:1; }
    .blab    { font-weight:700; font-size:21px; fill:#1f1f1f; text-anchor:middle; }
    .cont    { fill:#F4F5F7; stroke:#E2E4E8; stroke-width:1; }
    .inner   { fill:#ffffff; stroke:#E4E4E4; stroke-width:1; }
    .clab    { font-size:16px; fill:#7c7c7c; text-anchor:middle; }
    .dot     { fill:none; stroke:#B3A98C; stroke-width:1.4; stroke-dasharray:2 4; }
    .blackbx { fill:#101010; stroke:#101010; }
    .wlab    { font-weight:700; font-size:24px; fill:#ffffff; text-anchor:middle; }
    .wsub    { font-size:17px; fill:#e8e8e8; text-anchor:middle; }
    .flow    { fill:none; stroke:#4a4a4a; stroke-width:1.6; }
  </style>

  <!-- 요청 보안 가드레일 -->
  <rect class="bx" x="498" y="8" width="284" height="56" rx="4"/>
  <text class="blab" x="640" y="44">요청 보안 가드레일</text>
  <path class="flow" d="M640,64 L640,100" marker-end="url(#arrow)"/>

  <!-- outer container -->
  <rect class="cont" x="36" y="102" width="1208" height="332" rx="10"/>

  <!-- top wrapped resources -->
  <g>
    <rect class="bx" x="56"    y="126" width="214" height="68" rx="4"/>
    <text class="blab" x="163"  y="168">컨텍스트 오프로딩</text>

    <rect class="bx" x="294.5" y="126" width="214" height="68" rx="4"/>
    <text class="blab" x="401.5" y="168">Todo 계획</text>

    <rect class="bx" x="533"   y="126" width="214" height="68" rx="4"/>
    <text class="blab" x="640"  y="168">개인 메모리</text>

    <rect class="bx" x="771.5" y="126" width="214" height="68" rx="4"/>
    <text class="blab" x="878.5" y="168">스킬</text>

    <rect class="bx" x="1010"  y="126" width="214" height="68" rx="4"/>
    <text class="blab" x="1117" y="156">서브 Agent 위임</text>
    <text class="blab" x="1117" y="181">task 도구</text>
  </g>

  <!-- wrap / delegate labels -->
  <text class="clab" x="163"   y="226">감싸서 실행</text>
  <text class="clab" x="401.5" y="226">감싸서 실행</text>
  <text class="clab" x="640"   y="226">감싸서 실행</text>
  <text class="clab" x="878.5" y="226">감싸서 실행</text>
  <text class="clab" x="1117"  y="226">위임</text>

  <!-- dotted connectors -->
  <path class="dot" d="M163,194   C163,220 211,224 211,244"/>
  <path class="dot" d="M401.5,194 C401.5,220 425,224 425,244"/>
  <path class="dot" d="M640,194   C640,220 640,224 640,244"/>
  <path class="dot" d="M878.5,194 C878.5,220 855,224 855,244"/>
  <path class="dot" d="M1117,194  C1117,220 1069,224 1069,244"/>

  <!-- inner runtime rect -->
  <rect class="inner" x="56" y="244" width="1168" height="170" rx="8"/>

  <!-- runtime pipeline -->
  <rect class="bx" x="84" y="280" width="352" height="102" rx="4"/>
  <text class="blab" x="260" y="324">저장된 Agent Version 로딩</text>
  <text class="blab" x="260" y="350">Tool·서브 Agent 목록 확정</text>

  <path class="flow" d="M436,331 L488,331" marker-end="url(#arrow)"/>

  <rect class="bx" x="488" y="280" width="248" height="102" rx="4"/>
  <text class="blab" x="612" y="324">그래프 조립</text>
  <text class="blab" x="612" y="350">하네스 호출 한 번</text>

  <path class="flow" d="M736,331 L788,331" marker-end="url(#arrow)"/>

  <rect class="blackbx" x="788" y="266" width="420" height="130" rx="4"/>
  <text class="wlab" x="998" y="324">Root 판단 루프</text>
  <text class="wsub" x="998" y="352">직접 답변 / Tool 호출 / 위임</text>

  <!-- container -> bottom double arrows -->
  <path class="flow" d="M470,436 L470,474"  marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="flow" d="M1117,436 L1117,512" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- bottom-left: delegation targets -->
  <rect class="cont" x="36" y="476" width="942" height="128" rx="10"/>

  <rect class="bx" x="66" y="508" width="214" height="78" rx="4"/>
  <text class="blab" x="173" y="553">부모 상속 에이전트</text>

  <rect class="bx" x="342" y="508" width="272" height="78" rx="4"/>
  <text class="blab" x="478" y="542">사용자 서브 Agent</text>
  <text class="blab" x="478" y="566">전문 Agent</text>

  <rect class="bx" x="676" y="508" width="272" height="78" rx="4"/>
  <text class="blab" x="812" y="553">내장 Tool · MCP Tool</text>

  <!-- bottom-right: final -->
  <rect class="bx" x="1000" y="514" width="244" height="78" rx="4"/>
  <text class="blab" x="1122" y="559">최종 답변 or 승인 대기</text>
</svg>
