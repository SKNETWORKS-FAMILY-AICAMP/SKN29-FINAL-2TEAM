<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 | halil</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="page">
  <div class="bg-blob bg-blob-tl"></div>
  <div class="bg-blob bg-blob-br"></div>

  <div class="auth-container">
    <div class="header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        <span>halil</span>
      </div>
      <p class="tagline">AI 기반 업무 배정 코파일럿</p>
    </div>

    <div class="card">
      <div>
        <h1 class="card-title">로그인</h1>
        <p class="card-subtitle">서비스를 이용하려면 로그인을 진행해주세요.</p>
      </div>

      <form class="field-group">
        <div class="field">
          <label for="email">이메일</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="name@company.com" autocomplete="email">
          </div>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
            <svg class="eye-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
              <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
          </div>
        </div>
      </form>

      <button type="submit" class="btn-primary">로그인</button>

      <div class="divider">
        <div class="line"></div>
        <span>또는</span>
        <div class="line"></div>
      </div>

      <button type="button" class="btn-social">
        <span class="google-logo"><span class="r"></span><span class="y"></span><span class="g"></span><span class="b"></span></span>
        Google 계정으로 로그인
      </button>

      <button type="button" class="btn-social">
        <span class="jira-logo"><span></span></span>
        Jira 계정으로 로그인
      </button>
    </div>

    <div class="footer-links">
      <a href="find-password.html">비밀번호 찾기</a>
      <p style="margin:0;">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </div>
  </div>
</div>

<script>
  document.querySelector('.eye-toggle')?.addEventListener('click', () => {
    const input = document.getElementById('password');
    input.type = input.type === 'password' ? 'text' : 'password';
  });
</script>
</body>
</html>
