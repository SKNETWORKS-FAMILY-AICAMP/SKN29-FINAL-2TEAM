<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 | halil</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="page">
  <div class="bg-blob bg-blob-tl"></div>
  <div class="bg-blob bg-blob-br"></div>

  <div class="auth-container">
    <div class="header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        <span>halil</span>
      </div>
      <p class="tagline">AI 기반 업무 배정 코파일럿</p>
    </div>

    <div class="card">
      <div>
        <h1 class="card-title">비밀번호 찾기</h1>
        <p class="card-subtitle">가입한 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>
      </div>

      <form class="field-group">
        <div class="field">
          <label for="recovery-email">이메일 주소 <span class="required">*</span></label>
          <div class="input-wrapper">
            <input type="email" id="recovery-email" name="email" placeholder="name@company.com" autocomplete="email">
          </div>
        </div>
      </form>

      <button type="submit" class="btn-primary">재설정 링크 보내기</button>
    </div>

    <div class="footer-links">
      <a href="login.html">로그인으로 돌아가기</a>
    </div>
  </div>
</div>
</body>
</html>
